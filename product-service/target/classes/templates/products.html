<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Products</title>
</head>
<body>
<tr th:each="product: ${products}">
    <td th:text="${product.getId()}"></td>
    <td th:text="${product.getName()}"></td>
    <td th:text="${product.getDescription()}"></td>
    <td th:text="${product.getPrice()}"></td>
    <td><a th:href="@{/products/update/{productId}(productId=${product.getId()})}">Update</a></td>
    <td><a th:href="@{/products/delete/{productId}(productId=${product.getId()})}">Delete</a></td>
    <td><a th:href="@{/products/addtocart/{productId}(productId=${product.getId()})}">Add to cart</a></td>
</tr>
</body>
</html>
